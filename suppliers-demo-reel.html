<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResupplyAI · Supplier demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  h1,h2,.display{ font-family:'Manrope', sans-serif; letter-spacing:-0.02em; }
  html,body{ height:100%; background:#0b1020; overflow:hidden; }
  .stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 82% -12%, #1a2550, #0b1020 58%); }
  /* fixed 1280x720 canvas, scaled to fit the window */
  .reel{ position:relative; width:1280px; height:720px; transform-origin:center; }

  .browser{ position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(.985);
    width:1080px; height:624px; border-radius:14px; overflow:hidden; background:#fff;
    box-shadow:0 44px 120px rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.08);
    opacity:0; transition:opacity .45s ease, transform .6s cubic-bezier(.16,1,.3,1); }
  .browser.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .bar{ height:34px; background:#f1f3f9; border-bottom:1px solid #e5e8f0; display:flex; align-items:center; padding:0 13px; }
  .tl{ width:10px; height:10px; border-radius:50%; background:#d2d7e2; margin-right:7px; }
  .url{ flex:1; margin-left:8px; height:20px; background:#fff; border:1px solid #e5e8f0; border-radius:6px;
    font-size:11px; color:#8a93a8; display:flex; align-items:center; padding:0 10px; }
  .view{ position:relative; width:100%; height:590px; overflow:hidden; background:#fff; transition:opacity .32s ease; }
  .view.swap{ opacity:0; }
  iframe{ width:1440px; height:1200px; border:0; transform:scale(.75); transform-origin:top left; background:#fff; }

  .cap{ position:absolute; left:50%; bottom:30px; transform:translateX(-50%); width:920px; text-align:center; }
  .cap p{ display:inline-block; background:rgba(8,12,28,.84); color:#fff; font-size:21px; font-weight:500;
    line-height:1.42; padding:12px 22px; border-radius:12px; opacity:0; transform:translateY(8px);
    transition:opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1); }
  .cap p.show{ opacity:1; transform:translateY(0); }

  .wm{ position:absolute; left:42px; top:34px; display:flex; align-items:center; gap:9px; }
  .wm img{ height:22px; width:auto; object-fit:contain; }
  .wm span{ font-size:13px; color:rgba(255,255,255,.55); font-weight:500; }

  .prog{ position:absolute; right:42px; top:40px; display:flex; gap:6px; }
  .prog i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.22); transition:background .3s ease, width .3s ease; }
  .prog i.on{ background:#5e7ee8; width:18px; border-radius:4px; }

  .card{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; opacity:0; transform:translateY(10px); transition:opacity .6s ease, transform .7s cubic-bezier(.16,1,.3,1); pointer-events:none; }
  .card.show{ opacity:1; transform:translateY(0); }
  .card img{ height:44px; width:auto; object-fit:contain; margin-bottom:26px; }
  .card h1{ color:#fff; font-size:48px; font-weight:700; line-height:1.08; margin-bottom:16px; }
  .card p{ color:rgba(255,255,255,.6); font-size:19px; }
  .card .accent{ color:#9db4ff; }
</style>
</head>
<body>
<div class="stage">
  <div class="reel" id="reel">
    <div class="wm"><img src="logo-white-full.png" alt="ResupplyAI"><span>Suppliers</span></div>
    <div class="prog" id="prog"></div>

    <div class="browser" id="browser">
      <div class="bar"><span class="tl"></span><span class="tl"></span><span class="tl"></span><span class="url" id="url">resupply.ai</span></div>
      <div class="view swap" id="view"><iframe id="frame" src="about:blank" scrolling="no" title="demo"></iframe></div>
    </div>

    <div class="card" id="intro">
      <img src="logo-white-full.png" alt="ResupplyAI">
      <h1>Sell to the DLA,<br>the easy way.</h1>
      <p>A quick look at ResupplyAI for suppliers.</p>
    </div>
    <div class="card" id="end">
      <img src="logo-white-full.png" alt="ResupplyAI">
      <h1>Sell more of <span class="accent">what you already have.</span></h1>
      <p>resupply.ai · free for suppliers</p>
    </div>

    <div class="cap"><p id="cap"></p></div>
  </div>
</div>

<script>
const F=document.getElementById('frame'), CAP=document.getElementById('cap'), BR=document.getElementById('browser'),
      VIEW=document.getElementById('view'), URLB=document.getElementById('url'), PROG=document.getElementById('prog'),
      INTRO=document.getElementById('intro'), END=document.getElementById('end');
let browserShown=false;

const scenes=[
  {type:'card', el:INTRO, dur:2800},
  {type:'page', src:'suppliers-01-landing.html',          url:'resupply.ai',                   cap:'Meet ResupplyAI: your inventory, matched to what the DLA is buying.', scroll:0,   drive:driveLanding,    hold:900},
  {type:'page', src:'suppliers-02-signup.html',           url:'app.resupply.ai/join',          cap:'Sign up free: name, work email, company, CAGE.',                      scroll:0,   drive:driveSignup,     hold:1100},
  {type:'page', src:'suppliers-03-upload-inventory.html', url:'app.resupply.ai/inventory',     cap:'Upload your inventory. We map the columns and import it.',             scroll:40,  drive:driveUpload,     hold:2200},
  {type:'page', src:'suppliers-04-daily-matches.html',    url:'app.resupply.ai/matches',       cap:'Your dashboard: every DLA solicitation matched to your stock.',         scroll:0,   drive:driveDash,       hold:1000},
  {type:'page', src:'suppliers-05-quote-detail.html',     url:'app.resupply.ai/quote/2530',    cap:'Open a match, set your price, and add it to your cart.',                scroll:120, drive:driveQuote1, pre:()=>sessionStorage.setItem('quoteCtx', JSON.stringify({nsn:'2530-01-687-4521', name:'Brake Drum Assembly', qty:120, unit:1840})), hold:900},
  {type:'page', src:'suppliers-04-daily-matches.html',    url:'app.resupply.ai/matches',       cap:'Back to matches. Line up another bid.',                               scroll:320, drive:driveDash2,      hold:900},
  {type:'page', src:'suppliers-05-quote-detail.html',     url:'app.resupply.ai/quote/2815',    cap:'Confirm the part and attach your certifications.',                     scroll:120, drive:driveQuote2, pre:()=>sessionStorage.setItem('quoteCtx', JSON.stringify({nsn:'2815-01-112-9087', name:'Engine Cylinder Head', qty:30, unit:3560})), hold:900},
  {type:'page', src:'suppliers-06-quote-cart.html',       url:'app.resupply.ai/cart',          cap:'Review your cart and submit both quotes at once.',                     scroll:0,   drive:driveCart,       hold:2200},
  {type:'page', src:'suppliers-07-my-quotes.html',        url:'app.resupply.ai/quotes',        cap:'Track all your quotes in one place.',                                  scroll:0,   drive:driveQuotesView, hold:1500},
  {type:'page', src:'suppliers-11-trace-upload.html',     url:'app.resupply.ai/trace/2530',    cap:'The DLA requested traceability. Upload it and submit.',                scroll:0,   drive:driveTrace,      hold:2200},
  {type:'page', src:'suppliers-07-my-quotes.html',        url:'app.resupply.ai/quotes',        cap:'Back to your quotes. Everything stays in sync.',                      scroll:120, drive:driveQuotesView, hold:1400},
  {type:'page', src:'suppliers-14-quote-status.html',     url:'app.resupply.ai/quotes/148802', cap:'A quote was assigned to a buyer, follow its status live.',             scroll:60,  hold:4200},
  {type:'page', src:'suppliers-07-my-quotes.html',        url:'app.resupply.ai/quotes',        cap:'Another quote just won, time to send the purchase order.',             scroll:0,   drive:driveQuotesView, hold:1500},
  {type:'page', src:'suppliers-15-purchase-order.html',   url:'app.resupply.ai/po/148802',     cap:'You won, upload the PO and close it out.',                            scroll:60,  drive:drivePO,         hold:2600},
  {type:'card', el:END, dur:3900}
];

/* ---- interaction helpers (operate inside the same-origin iframe) ---- */
async function typeInto(el, text, win, per){
  if(!el) return; try{ el.focus(); }catch(e){}
  el.value='';
  for(const ch of text){ el.value+=ch; el.dispatchEvent(new win.Event('input',{bubbles:true})); await wait((per||60)+Math.random()*35); }
  el.dispatchEvent(new win.Event('change',{bubbles:true}));
}
function tick(el, win){ if(el && !el.checked){ el.checked=true; el.dispatchEvent(new win.Event('change',{bubbles:true})); } }
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:0.85em;height:0.85em;display:inline-block;vertical-align:-0.08em"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';

/* ---- per-screen client simulations ---- */
async function driveLanding(doc, win){
  await wait(700);
  for(const y of [320,760,1240,1760,2240,2700]){ try{ win.scrollTo({top:y,behavior:'smooth'}); }catch(e){} await wait(560); }
  await wait(450);
  try{ win.scrollTo({top:0,behavior:'smooth'}); }catch(e){} await wait(800);   // back up to "Get started"
}
async function driveSignup(doc, win){
  await wait(450);
  await typeInto(doc.getElementById('company'), 'Hermes Technical LLC', win);
  await typeInto(doc.getElementById('fullname'), 'Marco Ruiz', win);
  await typeInto(doc.getElementById('email'), 'marco@hermestech.com', win);
  await typeInto(doc.getElementById('cage'), '0VGZ7', win, 110);
  await typeInto(doc.getElementById('pwd'), 'Resupply2026!', win, 48);
  await typeInto(doc.getElementById('pwd2'), 'Resupply2026!', win, 48);
  tick(doc.getElementById('captcha'), win); await wait(240);
  tick(doc.getElementById('consent'), win); await wait(380);
  const sub=doc.querySelector('#form button[type="submit"]'); if(sub) sub.click();      // → email verification
  await wait(1050);
  const boxes=[...doc.querySelectorAll('.code-box')], code='481923';
  for(let i=0;i<boxes.length;i++){ boxes[i].value=code[i]; boxes[i].dispatchEvent(new win.Event('input',{bubbles:true})); await wait(175); }
  await wait(450);
  const vb=doc.getElementById('verifyBtn'); if(vb) vb.click();                          // validate code
}
async function driveUpload(doc, win){
  await wait(800);
  if(win.goMap) try{ win.goMap('Hermes_inventory_Jun2026.xlsx'); }catch(e){}            // file chosen → column mapping
  await wait(2700);
  if(win.finish) try{ win.finish(); }catch(e){}                                         // import 1,284 items → matched
}
async function driveDash(doc, win){
  await wait(700); try{ win.scrollTo({top:200,behavior:'smooth'}); }catch(e){} await wait(1400);
  try{ win.scrollTo({top:480,behavior:'smooth'}); }catch(e){} await wait(1300); try{ win.scrollTo({top:120,behavior:'smooth'}); }catch(e){}
}
async function driveDash2(doc, win){
  await wait(600); try{ win.scrollTo({top:430,behavior:'smooth'}); }catch(e){} await wait(1200); try{ win.scrollTo({top:560,behavior:'smooth'}); }catch(e){}
}
async function driveQuote1(doc, win){
  await wait(650);
  const price=doc.querySelector('input[placeholder="0.00"]'); if(price) await typeInto(price, '1,840.00', win, 55);
  await wait(400);
  tick(doc.getElementById('valChk'), win); if(win.updateGate) try{ win.updateGate(); }catch(e){}   // confirm part
  await wait(700);
  const add=doc.getElementById('addBtn'); if(add) add.click();                          // add to cart (→ matches)
}
async function driveQuote2(doc, win){
  await wait(500);
  const price=doc.querySelector('input[placeholder="0.00"]'); if(price) await typeInto(price, '3,560.00', win, 55);
  await wait(350);
  tick(doc.getElementById('valChk'), win); if(win.updateGate) try{ win.updateGate(); }catch(e){}
  const certs=doc.querySelector('input[placeholder*="AS9120"]'); if(certs) await typeInto(certs, 'AS9120, ISO 9001', win, 48);
  const msg=doc.getElementById('photoMsg'); if(msg){ msg.style.display='block'; msg.innerHTML=CHK+' 2 certifications attached. AS9120_cert.pdf, ISO9001_2015.pdf'; }
  await wait(900);
  const add=doc.getElementById('addBtn'); if(add) add.click();                          // add 2nd bid to cart
}
async function driveCart(doc, win){
  await wait(1600);                                                                     // read the two bids
  if(win.submitAll) try{ win.submitAll(); }catch(e){}                                   // submit all
}
async function driveQuotesView(doc, win){
  await wait(700); try{ win.scrollTo({top:170,behavior:'smooth'}); }catch(e){} await wait(1200); try{ win.scrollTo({top:360,behavior:'smooth'}); }catch(e){}
}
async function driveTrace(doc, win){
  await wait(900);
  if(win.onFiles) try{ win.onFiles({files:[{name:'Traceability_packet_2530.pdf'}]}); }catch(e){}   // upload doc
  await wait(1500);
  if(win.submitTrace) try{ win.submitTrace(); }catch(e){}                               // submit trace
}
async function drivePO(doc, win){
  await wait(900); try{ win.scrollTo({top:140,behavior:'smooth'}); }catch(e){} await wait(900);
  if(win.uploadPO) try{ win.uploadPO({files:[{name:'PO_SPE7L-2026-148802.pdf'}]}); }catch(e){}     // attach PO
  await wait(1100);
  if(win.submitPO) try{ win.submitPO(); }catch(e){}                                     // submit PO
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function loadFrame(src){ return new Promise(res=>{ let done=false; F.onload=()=>{ if(!done){done=true;res();} }; F.src=src; setTimeout(()=>{ if(!done){done=true;res();} },1800); }); }
async function showCap(t){ CAP.classList.remove('show'); await wait(220); CAP.textContent=t; CAP.classList.add('show'); }

function buildDots(){ PROG.innerHTML=''; scenes.forEach(()=>PROG.appendChild(document.createElement('i'))); }
function setDot(i){ [...PROG.children].forEach((d,k)=>d.classList.toggle('on', k===i)); }

async function gotoPage(s){
  CAP.classList.remove('show');
  if(s.pre){ try{ s.pre(); }catch(e){} }   // seed sessionStorage before the page reads it on load
  if(!browserShown){
    VIEW.classList.add('swap');                 // keep content hidden while loading
    URLB.textContent=s.url; await loadFrame(s.src); await wait(220);
    try{ F.contentWindow.scrollTo(0, s.scroll||0); }catch(e){}
    BR.classList.add('show'); browserShown=true; await wait(160);
    VIEW.classList.remove('swap');               // fade page in inside the frame
  } else {
    VIEW.classList.add('swap'); await wait(300);  // fade old page out (frame stays)
    URLB.textContent=s.url; await loadFrame(s.src); await wait(220);
    try{ F.contentWindow.scrollTo(0, s.scroll||0); }catch(e){}
    VIEW.classList.remove('swap');               // fade new page in
  }
  await showCap(s.cap);
  if(s.drive){ try{ await s.drive(F.contentDocument, F.contentWindow); }catch(e){ console.log('drive error', e); } }
  await wait(s.hold || 1500);
}
async function gotoCard(s){
  CAP.classList.remove('show');
  if(browserShown){ BR.classList.remove('show'); VIEW.classList.add('swap'); browserShown=false; await wait(500); }
  s.el.classList.add('show');
  await wait(s.dur);
  s.el.classList.remove('show');
  await wait(560);
}
async function run(){
  try{ localStorage.removeItem('quoteCart'); localStorage.removeItem('traceDecl'); localStorage.removeItem('traceHistory'); sessionStorage.removeItem('quoteCtx'); }catch(e){}  // fresh state each loop
  buildDots();
  for(let i=0;i<scenes.length;i++){
    setDot(i);
    const s=scenes[i];
    if(s.type==='card') await gotoCard(s); else await gotoPage(s);
  }
  run(); // loop
}

function fit(){
  const r=document.getElementById('reel');
  const sc=Math.min(window.innerWidth/1280, window.innerHeight/720);
  r.style.transform='scale('+sc+')';
}
window.addEventListener('resize', fit);
window.addEventListener('load', ()=>{ fit(); setTimeout(run, 500); });
</script>
</body>
</html>
